<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0b1220" />
    </linearGradient>
    <filter id="grain">
      <feTurbulence baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="t"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)"/>
  <g fill-opacity="0.02">
    <rect x="0" y="0" width="1600" height="900" fill="#ffffff" filter="url(#grain)" />
  </g>
  <g opacity="0.06">
    <circle cx="300" cy="200" r="400" fill="#60a5fa" />
    <circle cx="1300" cy="700" r="500" fill="#7c3aed" />
  </g>
</svg>
